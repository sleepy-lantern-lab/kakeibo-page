<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルな家計簿アプリ</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <h1>家計簿</h1>
  </header>

  <main>
    <section aria-labelledby="summary-heading">
      <h2 id="summary-heading">差引残高</h2>
      <p>差引残高：<output aria-label="差引残高">0円</output></p>
    </section>

    <section aria-labelledby="entry-heading">
      <h2 id="entry-heading">家計簿に登録</h2>
      <form>
        <p>
          <label for="entry-date">日付</label>
          <input type="date" id="entry-date" name="date" required>
        </p>
        <p>
          <label for="entry-item">品目</label>
          <input type="text" id="entry-item" name="item" required>
        </p>
        <p>
          <label for="entry-type">収支区分</label>
          <select id="entry-type" name="type" required>
            <option value="expense">支出</option>
            <option value="income">収入</option>
          </select>
        </p>
        <p>
          <label for="entry-amount">金額（円）</label>
          <input type="text" id="entry-amount" name="amount" inputmode="numeric" pattern="[0-9]+" title="半角数字で入力してください" required>
        </p>
        <button type="submit">追加する</button>
      </form>
      <p id="app-message" role="alert" hidden></p>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">登録したデータ</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">日付</th>
            <th scope="col">品目</th>
            <th scope="col">収支区分</th>
            <th scope="col">金額</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="4">登録データはありません</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
